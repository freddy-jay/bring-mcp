[project]
name = "bring-mcp"
version = "0.1.0"
description = "MCP server for managing Bring! shopping lists from Claude and other LLM clients"
readme = "README.md"
license = "MIT"
keywords = ["mcp", "bring", "shopping-list", "claude", "llm"]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "bring-api>=1.1.2",
    "mcp[cli]>=2.1.1",
]

[project.scripts]
bring-mcp = "bring_mcp:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"
